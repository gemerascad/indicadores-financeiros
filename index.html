<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro</title>
    <style>
        /* Reset de estilos básicos */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        /* Container do iframe */
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Tela de Carregamento (Spinner) */
        .loader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text {
            margin-top: 16px;
            font-size: 15px;
            color: #64748b;
            font-weight: 500;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Classe para ocultar o loader */
        .loader-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
  <meta property="og:title" content="Dashboard Financeiro">
  <meta name="twitter:title" content="Dashboard Financeiro">
  <meta name="description" content="Payment Insights provides a financial dashboard for analyzing payment data.">
  <meta property="og:description" content="Payment Insights provides a financial dashboard for analyzing payment data.">
  <meta name="twitter:description" content="Payment Insights provides a financial dashboard for analyzing payment data.">
  <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/2c0e2bc0-084c-4589-82db-a66663364108/id-preview-8cdbf027--4f26a4c4-e2b5-4d99-bf6d-7c17f9a38234.lovable.app-1779651783427.png">
  <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/2c0e2bc0-084c-4589-82db-a66663364108/id-preview-8cdbf027--4f26a4c4-e2b5-4d99-bf6d-7c17f9a38234.lovable.app-1779651783427.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
</head>
<body>

    <!-- Tela de Carregamento Fluida -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Carregando o Dashboard...</div>
    </div>

    <!-- Container do Dashboard incorporado -->
    <div class="iframe-container">
        <iframe 
            src="https://id-preview--4f26a4c4-e2b5-4d99-bf6d-7c17f9a38234.lovable.app/" 
            title="Dashboard Lovable"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen
            id="dashboard-iframe">
        </iframe>
    </div>

    <script>
        // Remove a tela de carregamento assim que o iframe estiver pronto
        const iframe = document.getElementById('dashboard-iframe');
        const loader = document.getElementById('loader');

        iframe.addEventListener('load', function() {
            loader.classList.add('hidden');
        });
        
        // Fallback de segurança: remove o loader após 6 segundos caso ocorra lentidão na rede
        setTimeout(function() {
            if (!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
            }
        }, 6000);
    </script>
</body>
</html>
